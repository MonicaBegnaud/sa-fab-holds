<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA Fab Holds</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
  <header class="site-header">
    <div class="header-brand">
      <div class="brand-logo">SA<span>-</span>Fab<span>-</span>Holds</div>
      <div class="brand-divider"></div>
    </div>
    <div class="header-meta">
      <nav class="header-nav">
        <a href="index.html" class="nav-link active">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="page-wrap">

    <div class="section-label">Shift Overview</div>
    <div class="kpi-grid">
      <div class="kpi-card" style="--kpi-color: var(--danger)">
        <div class="kpi-label">Active Holds</div>
        <div class="kpi-value">24</div>
    </div>
 
      <div class="kpi-card" style="--kpi-color: var(--warning)">
        <div class="kpi-label">Avg Hold Age</div>
        <div class="kpi-value">18<sup>h</sup></div>
      </div>
 
      <div class="kpi-card" style="--kpi-color: var(--danger)">
        <div class="kpi-label">P1 Critical</div>
        <div class="kpi-value">7</div>
      </div>
 
      <div class="kpi-card" style="--kpi-color: var(--primary)">
        <div class="kpi-label">Released Today</div>
        <div class="kpi-value">11</div>
      </div>
 
      <div class="kpi-card" style="--kpi-color: var(--primary)">
        <div class="kpi-label">Hold Rate</div>
        <div class="kpi-value">7.7<sup>%</sup></div>
      </div>
    </div>




  </main>
  </body>
</html>
